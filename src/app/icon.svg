  <!-- Wheel left -->
  <circle cx="27" cy="74" r="11" fill="#160E09"/>
  <circle cx="27" cy="74" r="7.5" fill="#2D1A0A"/>
  <circle cx="27" cy="74" r="3" fill="#160E09"/>

  <!-- Wheel right -->
