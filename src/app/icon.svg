  <!-- Windows -->
  <rect x="23" y="44" width="19" height="13" rx="2" fill="#E8550A" opacity="0.65"/>
  <rect x="44" y="44" width="19" height="13" rx="2" fill="#E8550A" opacity="0.65"/>

  <!-- Roof rack bar -->
