<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Orange sun -->
  <circle cx="50" cy="38" r="32" fill="#E8550A"/>

  <!-- Ground / base -->
  <rect x="0" y="72" width="100" height="28" fill="#1a0f00"/>

  <!-- Jeep body -->
  <rect x="10" y="60" width="80" height="20" rx="3" fill="#1a0f00"/>

  <!-- Cabin -->
  <rect x="20" y="46" width="50" height="18" rx="3" fill="#1a0f00"/>

  <!-- Windshield / windows -->
  <rect x="23" y="49" width="19" height="12" rx="2" fill="#E8550A" opacity="0.85"/>
  <rect x="45" y="49" width="19" height="12" rx="2" fill="#E8550A" opacity="0.85"/>

  <!-- Front bumper -->
  <rect x="6" y="64" width="10" height="12" rx="2" fill="#1a0f00"/>
  <!-- Rear bumper -->
  <rect x="84" y="64" width="10" height="12" rx="2" fill="#1a0f00"/>

  <!-- Wheels -->
  <circle cx="26" cy="80" r="11" fill="#111"/>
  <circle cx="26" cy="80" r="6" fill="#2a1a00"/>
  <circle cx="26" cy="80" r="2.5" fill="#111"/>

  <circle cx="74" cy="80" r="11" fill="#111"/>
  <circle cx="74" cy="80" r="6" fill="#2a1a00"/>
  <circle cx="74" cy="80" r="2.5" fill="#111"/>

  <!-- Roof rack -->
  <rect x="20" y="44" width="50" height="4" rx="1" fill="#1a0f00"/>
</svg>
